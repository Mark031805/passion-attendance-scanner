<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Passion City Church Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 430px;
      margin: 25px auto;
      padding: 25px 18px;
      background: #1b1b1b;
      border-radius: 22px;
    }

    .church {
      font-size: 10px;
      letter-spacing: 4px;
      opacity: .6;
    }

    h1 {
      font-size: 25px;
      margin: 15px 0 5px;
    }

    .subtitle {
      font-size: 13px;
      opacity: .7;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 17px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    #scannerPage {
      display: none;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #status {
      margin-top: 15px;
      padding: 18px;
      background: #292929;
      border-radius: 10px;
      line-height: 1.6;
      min-height: 45px;
    }

    .success {
      font-size: 21px;
      font-weight: bold;
    }

    .duplicate {
      font-size: 21px;
      font-weight: bold;
    }

    .error {
      font-size: 20px;
      font-weight: bold;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
    }

    .footer {
      margin-top: 25px;
      font-size: 9px;
      letter-spacing: 3px;
      opacity: .35;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="church">
    PASSION CITY CHURCH
  </div>

  <div id="homePage">

    <h1>Attendance Scanner</h1>

    <div class="subtitle">
      Select today's celebration
    </div>

    <button onclick="openScanner('SUNDAY CELL CELEBRATION')">
      SUNDAY CELL CELEBRATION
    </button>

    <button onclick="openScanner('YOUTH CELL CELEBRATION')">
      YOUTH CELL CELEBRATION
    </button>

  </div>


  <div id="scannerPage">

    <h1>Scan Member QR</h1>

    <div id="celebration" class="subtitle"></div>

    <div id="reader"></div>

    <div id="status">
      Starting camera...
    </div>

  </div>


  <div class="footer">
    PASSION CELL CELEBRATION
  </div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbxOBz-XZL8b16Fhg8XhpbX8M5w8U79WwQ6ethXJm8nHic39JdvyrJ7M_yYNaomKHWZo/exec';

let qrScanner = null;
let scanLocked = false;
let selectedCelebration = '';


async function openScanner(type) {

  selectedCelebration = type;

  document.getElementById('homePage').style.display = 'none';
  document.getElementById('scannerPage').style.display = 'block';

  document.getElementById('celebration').textContent = type;

  document.getElementById('status').innerHTML =
    'Opening rear camera...';

  qrScanner = new Html5Qrcode('reader');

  try {

    await qrScanner.start(

      {
        facingMode: {
          exact: 'environment'
        }
      },

      {
        fps: 15,

        qrbox: function(viewfinderWidth, viewfinderHeight) {

          const size = Math.floor(
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.75
          );

          return {
            width: size,
            height: size
          };
        },

        aspectRatio: 1.0,
        disableFlip: true
      },

      onScanSuccess,

      function() {}

    );

    document.getElementById('status').innerHTML =
      'Point the camera at the member QR code.';

  } catch (error) {

    try {

      await qrScanner.start(

        {
          facingMode: 'environment'
        },

        {
          fps: 15,
          qrbox: {
            width: 250,
            height: 250
          },
          disableFlip: true
        },

        onScanSuccess,

        function() {}

      );

      document.getElementById('status').innerHTML =
        'Point the camera at the member QR code.';

    } catch (secondError) {

      document.getElementById('status').innerHTML =
        '<div class="error">CAMERA ERROR</div><br>' +
        secondError;
    }
  }
}


async function onScanSuccess(decodedText) {

  if (scanLocked) return;

  scanLocked = true;

  let memberId =
    String(decodedText || '')
      .trim()
      .toUpperCase();

  try {

    const qrUrl = new URL(decodedText);

    const id = qrUrl.searchParams.get('id');

    if (id) {
      memberId = id.trim().toUpperCase();
    }

  } catch (e) {}


  document.getElementById('status').innerHTML =
    'QR detected...<br>Checking attendance...';


  if (navigator.vibrate) {
    navigator.vibrate(100);
  }


  try {

    const requestUrl =
      API_URL +
      '?id=' +
      encodeURIComponent(memberId) +
      '&celebration=' +
      encodeURIComponent(selectedCelebration) +
      '&t=' +
      Date.now();


    const response = await fetch(requestUrl);

    const result = await response.json();


    if (result.status === 'success') {

      document.getElementById('status').innerHTML =
        '<div class="success">✓ WELCOME TO PASSION CITY CHURCH</div>' +
        '<div class="name">' + result.name + '</div>' +
        '<br>' +
        result.network +
        '<br>Cell Leader: ' +
        result.leader;

      if (navigator.vibrate) {
        navigator.vibrate([100, 70, 100]);
      }

    }

    else if (result.status === 'duplicate') {

      document.getElementById('status').innerHTML =
        '<div class="duplicate">⚠ ALREADY CHECKED IN</div>' +
        '<div class="name">' + result.name + '</div>' +
        '<br>' +
        result.network +
        '<br>Cell Leader: ' +
        result.leader;

    }

    else {

      document.getElementById('status').innerHTML =
        '<div class="error">✕ ' +
        (result.message || 'MEMBER NOT FOUND') +
        '</div>';

    }


  } catch (error) {

    document.getElementById('status').innerHTML =
      '<div class="error">CONNECTION ERROR</div>' +
      '<br>Please try again.';

  }


  setTimeout(function() {

    scanLocked = false;

    document.getElementById('status').innerHTML =
      'Ready for next member...';

  }, 3500);

}

</script>

</body>
</html>
