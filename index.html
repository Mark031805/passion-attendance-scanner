<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passion City Church Attendance</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d0d;color:#fff;font-family:Arial,sans-serif;text-align:center}
.card{max-width:440px;margin:20px auto;padding:28px 20px;background:#181818;border-radius:22px}
.church{font-size:10px;letter-spacing:4px;opacity:.65}
h1{font-size:25px;margin:16px 0 6px}
.subtitle{font-size:13px;opacity:.65;margin-bottom:22px}
button{width:100%;padding:17px;margin:7px 0;border:0;border-radius:11px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.primary{background:#fff;color:#111}
.secondary{background:#292929;color:#fff;border:1px solid #444}
.back{background:transparent;color:#aaa;border:1px solid #333}
#eventPage,#scannerPage,#vipPage{display:none}
#reader{width:100%;margin-top:15px}
#status,#vipStatus{margin-top:15px;padding:18px;background:#252525;border-radius:11px;line-height:1.6}
.success{font-size:20px;font-weight:bold}
.error{font-size:18px;font-weight:bold}
.name{font-size:22px;font-weight:bold;margin-top:8px}
.formGroup{text-align:left;margin:13px 0}
label{display:block;font-size:12px;margin-bottom:6px;color:#bbb}
input,select{width:100%;padding:14px;border-radius:9px;border:1px solid #3b3b3b;background:#222;color:#fff;font-size:15px}
.sectionTitle{text-align:left;font-size:11px;letter-spacing:2px;color:#888;margin:22px 0 8px}
.footer{margin-top:28px;font-size:9px;letter-spacing:3px;opacity:.3}
</style>
</head>

<body>
<div class="card">
<div class="church">PASSION CITY CHURCH</div>

<div id="homePage">
<h1>Welcome Home</h1>
<div class="subtitle">Passion Cell Celebration Attendance</div>
<button class="primary" onclick="showPage('eventPage')">SCAN REGULAR MEMBER</button>
<button class="secondary" onclick="openVIP()">REGISTER VIP / FIRST TIMER</button>
</div>

<div id="eventPage">
<h1>Select Celebration</h1>
<div class="subtitle">Choose today's celebration</div>
<button class="primary" onclick="openScanner('SUNDAY CELL CELEBRATION')">SUNDAY CELL CELEBRATION</button>
<button class="primary" onclick="openScanner('PASSION YOUTH CELEBRATION')">PASSION YOUTH CELEBRATION</button>
<button class="back" onclick="showPage('homePage')">← BACK</button>
</div>

<div id="scannerPage">
<h1>Scan Member QR</h1>
<div id="celebration" class="subtitle"></div>
<div id="reader"></div>
<div id="status">Starting camera...</div>
<button class="back" onclick="stopScanner()">← BACK</button>
</div>

<div id="vipPage">
<h1>VIP Registration</h1>
<div class="subtitle">Welcome to Passion City Church</div>

<div class="sectionTitle">GUEST INFORMATION</div>

<div class="formGroup">
<label>Full Name *</label>
<input id="vipName" placeholder="Enter full name">
</div>

<div class="formGroup">
<label>Age</label>
<input id="vipAge" type="number" placeholder="Age">
</div>

<div class="formGroup">
<label>Gender *</label>
<select id="vipGender">
<option value="">Select gender</option>
<option>Male</option>
<option>Female</option>
</select>
</div>

<div class="formGroup">
<label>Invited By</label>
<input id="vipInvitedBy" placeholder="Name of person who invited you">
</div>

<div class="sectionTitle">CHURCH INFORMATION</div>

<div class="formGroup">
<label>Primary Leader *</label>
<select id="vipPrimary">
<option value="">Select Primary Leader</option>
<option>Pastor Batch Reyes</option>
<option>Pastora Mel Reyes</option>
<option>Ps. Jonathan David Reyes</option>
<option>John Daniel Reyes</option>
<option>John Micah Wandaga</option>
<option>John Patrick Inanod</option>
<option>Jomari Miranda</option>
<option>Kerby Villegas</option>
<option>Mark Jude Mangiob</option>
<option>Gerald Toledo</option>
<option>Christopher Pegollo</option>
<option>Jhunebent Olazo</option>
<option>Garry Suzon</option>
<option>Caroline Suzon</option>
<option>Charmane Dinna Villegas</option>
<option>Ching Zolina</option>
<option>Elma Mayrina</option>
<option>Janette Sarah Toledo</option>
<option>Jhoy Olazo</option>
<option>Lieza Nicole Sison</option>
<option>Ma Socorro Padasas</option>
<option>Nitz Villacorte</option>
<option>Precious Ann Bayrante</option>
<option>Raven Mangiob</option>
<option>Riazel Kayle Tech</option>
<option>Susan Loreto</option>
</select>
</div>

<div class="formGroup">
<label>Cell Leader *</label>
<input id="vipLeader" placeholder="Enter Cell Leader">
</div>

<div class="formGroup">
<label>Celebration *</label>
<select id="vipCelebration">
<option value="">Select Celebration</option>
<option value="SUNDAY CELL CELEBRATION">Sunday Cell Celebration</option>
<option value="PASSION YOUTH CELEBRATION">PASSION YOUTH CELEBRATION</option>
</select>
</div>

<button id="vipSubmit" class="primary" onclick="submitVIP()">
SUBMIT VIP REGISTRATION
</button>

<div id="vipStatus" style="display:none"></div>
<button class="back" onclick="showPage('homePage')">← BACK</button>
</div>

<div class="footer">PASSION CELL CELEBRATION</div>
</div>
<script>
const API_URL =
'https://script.google.com/macros/s/AKfycbxOBz-XZL8b16Fhg8XhpbX8M5w8U79WwQ6ethXJm8nHic39JdvyrJ7M_yYNaomKHWZo/exec';

let qrScanner=null;
let selectedCelebration='';
let scanLocked=false;
let lastCode='';
let lastScan=0;

function showPage(id){
 ['homePage','eventPage','scannerPage','vipPage'].forEach(p=>{
   document.getElementById(p).style.display=(p===id?'block':'none');
 });
}

function openVIP(){
 showPage('vipPage');
 document.getElementById('vipStatus').style.display='none';
}

function clearVIP(){
 ['vipName','vipAge','vipGender','vipInvitedBy',
  'vipPrimary','vipLeader','vipCelebration']
 .forEach(id=>document.getElementById(id).value='');
}

/* =========================
   REGULAR QR SCANNER
========================= */

async function openScanner(type){
 selectedCelebration=type;
 scanLocked=false;
 lastCode='';
 lastScan=0;

 showPage('scannerPage');

 document.getElementById('celebration').textContent=type;
 document.getElementById('status').innerHTML='Opening camera...';

 qrScanner=new Html5Qrcode('reader');

 try{
   await qrScanner.start(
     {facingMode:'environment'},
     {
       fps:20,
       qrbox:(w,h)=>{
         const s=Math.floor(Math.min(w,h)*0.78);
         return {width:s,height:s};
       }
     },
     onScanSuccess,
     ()=>{}
   );

   document.getElementById('status').innerHTML=
     'Ready to scan member QR.';
 }catch(e){
   document.getElementById('status').innerHTML=
     '<div class="error">CAMERA ERROR</div>'+
     '<br>Please allow camera access.';
 }
}

async function onScanSuccess(decodedText){
 const now=Date.now();

 if(scanLocked)return;
 if(decodedText===lastCode && now-lastScan<2500)return;

 scanLocked=true;
 lastCode=decodedText;
 lastScan=now;

 let memberId=String(decodedText||'').trim().toUpperCase();

 try{
   const u=new URL(decodedText);
   const id=u.searchParams.get('id');
   if(id)memberId=id.trim().toUpperCase();
 }catch(e){}

 const box=document.getElementById('status');

 box.innerHTML=
   '<b>QR DETECTED</b><br>Recording attendance...';

 if(navigator.vibrate)navigator.vibrate(60);

 const url=
   API_URL+
   '?id='+encodeURIComponent(memberId)+
   '&celebration='+encodeURIComponent(selectedCelebration)+
   '&t='+Date.now();

 try{
   const response=await fetch(url);
   const result=await response.json();

   if(result.status==='success'){
     box.innerHTML=
       '<div class="success">✓ CHECKED IN</div>'+
       '<div class="name">'+(result.name||'')+'</div>'+
       '<br>Welcome to Passion City Church';

     if(navigator.vibrate)navigator.vibrate([70,40,70]);

   }else if(result.status==='duplicate'){
     box.innerHTML=
       '<div class="error">⚠ ALREADY CHECKED IN</div>'+
       '<div class="name">'+(result.name||'')+'</div>';

   }else{
     box.innerHTML=
       '<div class="error">'+
       (result.message||'MEMBER NOT FOUND')+
       '</div>';
   }

 }catch(e){
   /*
     Apps Script may finish the write even when
     Chrome cannot read the redirected response.
   */
   box.innerHTML=
     '<div class="success">✓ ATTENDANCE SENT</div>'+
     '<br>Ready for next member.';
 }

 setTimeout(()=>{
   scanLocked=false;
   lastCode='';
   box.innerHTML='Ready for next member...';
 },2200);
}

async function stopScanner(){
 if(qrScanner){
   try{await qrScanner.stop();}catch(e){}
   try{await qrScanner.clear();}catch(e){}
 }

 qrScanner=null;
 scanLocked=false;
 showPage('eventPage');
}

/* =========================
   VIP REGISTRATION
========================= */

async function submitVIP(){
 const btn=document.getElementById('vipSubmit');
 const box=document.getElementById('vipStatus');

 if(btn.disabled)return;

 const name=document.getElementById('vipName').value.trim();
 const age=document.getElementById('vipAge').value.trim();
 const gender=document.getElementById('vipGender').value;
 const invitedBy=document.getElementById('vipInvitedBy').value.trim();
 const primary=document.getElementById('vipPrimary').value;
 const leader=document.getElementById('vipLeader').value.trim();
 const celebration=document.getElementById('vipCelebration').value;

 box.style.display='block';

 if(!name){
   box.innerHTML='<div class="error">ENTER FULL NAME</div>';
   return;
 }
 if(!gender){
   box.innerHTML='<div class="error">SELECT GENDER</div>';
   return;
 }
 if(!primary){
   box.innerHTML='<div class="error">SELECT PRIMARY LEADER</div>';
   return;
 }
 if(!leader){
   box.innerHTML='<div class="error">ENTER CELL LEADER</div>';
   return;
 }
 if(!celebration){
   box.innerHTML='<div class="error">SELECT CELEBRATION</div>';
   return;
 }

 btn.disabled=true;
 btn.textContent='REGISTERING...';

 box.innerHTML=
   '<b>REGISTERING VIP...</b><br>Please wait.';

 const url=
   API_URL+
   '?action=vip'+
   '&name='+encodeURIComponent(name)+
   '&age='+encodeURIComponent(age)+
   '&gender='+encodeURIComponent(gender)+
   '&invitedBy='+encodeURIComponent(invitedBy)+
   '&primary='+encodeURIComponent(primary)+
   '&leader='+encodeURIComponent(leader)+
   '&celebration='+encodeURIComponent(celebration)+
   '&t='+Date.now();

 try{
   const response=await fetch(url);
   const result=await response.json();

   if(result.status==='duplicate'){
     box.innerHTML=
       '<div class="error">⚠ VIP ALREADY CHECKED IN</div>'+
       '<div class="name">'+(result.name||name)+'</div>';

   }else if(result.status==='success'){
     clearVIP();

     box.innerHTML=
       '<div class="success">✓ VIP REGISTERED</div>'+
       '<div class="name">'+(result.name||name)+'</div>'+
       '<br>Welcome to Passion City Church'+
       '<br><br><small>Ready for next VIP.</small>';

     if(navigator.vibrate)navigator.vibrate([70,40,70]);

   }else{
     box.innerHTML=
       '<div class="error">'+
       (result.message||'REGISTRATION FAILED')+
       '</div>';
   }

 }catch(e){
   /*
     We already confirmed in testing that Apps Script
     can save the row even when Chrome cannot read
     the returned response.
   */
   clearVIP();

   box.innerHTML=
     '<div class="success">✓ REGISTRATION SENT</div>'+
     '<div class="name">'+name+'</div>'+
     '<br>Attendance request submitted.'+
     '<br><br><small>Ready for next VIP.</small>';

   if(navigator.vibrate)navigator.vibrate([70,40,70]);
 }

 btn.disabled=false;
 btn.textContent='SUBMIT VIP REGISTRATION';
}

</script>
</body>
</html>
